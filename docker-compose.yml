services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cahaya
      POSTGRES_PASSWORD: cahaya
      POSTGRES_DB: cahaya_gading
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cahaya -d cahaya_gading"]
      interval: 2s
      timeout: 2s
      retries: 30

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://cahaya:cahaya@db:5432/cahaya_gading?sslmode=disable
      JWT_SECRET: dev-secret
      JWT_EXPIRES_MINUTES: "120"
    ports:
      - "8080:8080"